name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Zip से गायब प्रोजेक्ट फाइलों को एक्सट्रैक्ट करें
      - name: Extract Project Files
        run: |
          if [ -f "barabar-darshan-2026 (2).zip" ]; then
            echo "Extracting complete project files from zip..."
            unzip -o "barabar-darshan-2026 (2).zip"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create Dummy .env File
        run: |
          touch .env
          echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" >> .env

      # 2. सीधे सिस्टम के 'gradle' से बिल्ड करें (wrapper jar की ज़रूरत खत्म)
      - name: Build Debug APK
        run: gradle assembleDebug --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barabar-Darshan-Debug-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
