name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # प्रोजेक्ट फोल्डर का पाथ यहाँ सेट कर दिया गया है
    defaults:
      run:
        working-directory: './barabar-darshan-2026 (2)'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # AI Studio Placeholder Fix: .env फ़ाइल बनाता है
      - name: Create Dummy .env File
        run: |
          touch .env
          echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" >> .env

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barabar-Darshan-Debug-APK
          path: 'barabar-darshan-2026 (2)/app/build/outputs/apk/debug/app-debug.apk'
