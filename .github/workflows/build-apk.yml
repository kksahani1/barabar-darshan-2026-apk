name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Zip से गायब फाइलों को एक्सट्रैक्ट करें
      - name: Extract Project Files
        run: |
          if [ -f "barabar-darshan-2026 (2).zip" ]; then
            echo "Extracting complete project files from zip..."
            unzip -o "barabar-darshan-2026 (2).zip"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 2. अगर gradle-wrapper.jar गायब है, तो सिस्टम के Gradle से इसे तुरंत री-जनरेट करें
      - name: Regenerate Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper jar missing. Regenerating..."
            gradle wrapper
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create Dummy .env File
        run: |
          touch .env
          echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" >> .env

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barabar-Darshan-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
