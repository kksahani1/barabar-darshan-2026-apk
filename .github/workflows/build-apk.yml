name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Zip से गायब gradle और catalog फाइलों को एक्सट्रैक्ट करें
      - name: Extract Missing Catalog & Dependencies
        run: |
          if [ -f "barabar-darshan-2026 (2).zip" ]; then
            echo "Extracting complete project files from zip..."
            unzip -o "barabar-darshan-2026 (2).zip"
          fi

      # 2. सुनिश्चित करें कि app और gradle फोल्डर सही स्थान पर हैं
      - name: Align Directory Structure
        run: |
          if [ ! -d "gradle" ]; then
            GRADLE_DIR=$(find . -maxdepth 3 -type d -name "gradle" | head -n 1)
            if [ -n "$GRADLE_DIR" ]; then
              PROJECT_DIR=$(dirname "$GRADLE_DIR")
              echo "Restoring gradle catalog from $PROJECT_DIR..."
              cp -r $PROJECT_DIR/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create Dummy .env File
        run: |
          touch .env
          echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" >> .env

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barabar-Darshan-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
